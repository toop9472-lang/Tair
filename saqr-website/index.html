<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صقر - تطبيق المكافآت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a0f 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #a3e635;
        }
        p {
            color: #888;
            font-size: 1.2em;
        }
        .download-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #a3e635;
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .download-btn:hover {
            background: #84cc16;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 صقر</h1>
        <p>العب واكسب النقاط والمكافآت</p>
        <a href="https://play.google.com/store/apps/details?id=com.saqr.rewards" class="download-btn">
            تحميل التطبيق
        </a>
    </div>
</body>
</html>
